<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/>
    </marker>
  </defs>
  <style>
    .lbl  { font-size:12px; font-weight:bold; fill:#0b0b0b; }
    .sub  { font-size:10.5px; fill:#52514e; }
    .cap  { font-size:11px; fill:#52514e; }
    .mono { font-size:11px; font-family:"DejaVu Sans Mono",monospace; fill:#0b0b0b; }
    .dim  { font-size:10px; font-family:"DejaVu Sans Mono",monospace; fill:#52514e; }
    .ln   { stroke:#52514e; stroke-width:1.6; fill:none; marker-end:url(#b1); }
    .box  { stroke-width:1.5; rx:4; }
  </style>
  <rect x="0" y="0" width="680" height="430" fill="#fcfcfb"/>

  <!-- left column: the pipeline -->
  <text class="lbl" x="24" y="24">What happens when you type a word</text>

  <rect class="box" x="24" y="36" width="250" height="34" fill="#ffffff" stroke="#0b0b0b"/>
  <text class="mono" x="36" y="58">MiniOS&gt; run date</text>

  <path class="ln" d="M 149 70 L 149 92"/>
  <rect class="box" x="24" y="92" width="250" height="40" fill="#f2f2f0" stroke="#52514e"/>
  <text class="mono" x="36" y="110">shell_run()</text>
  <text class="sub"  x="36" y="125">reads the line, handles Ctrl-C</text>

  <path class="ln" d="M 149 132 L 149 154"/>
  <rect class="box" x="24" y="154" width="250" height="40" fill="#f2f2f0" stroke="#52514e"/>
  <text class="mono" x="36" y="172">shell_execute_line()</text>
  <text class="sub"  x="36" y="187">trim → split into words</text>

  <path class="ln" d="M 149 194 L 149 216"/>
  <rect class="box" x="24" y="216" width="250" height="40" fill="#fff6e8" stroke="#eda100"/>
  <text class="mono" x="36" y="234">shell_find_command()</text>
  <text class="sub"  x="36" y="249">walks each table in turn →</text>

  <path class="ln" d="M 149 256 L 149 300"/>
  <rect class="box" x="24" y="300" width="250" height="40" fill="#fdefe8" stroke="#eb6834"/>
  <text class="mono" x="36" y="318">cmd_run()</text>
  <text class="sub"  x="36" y="333">Module 2 · src/process.c</text>

  <!-- right column: the table list -->
  <text class="lbl" x="330" y="24">The integration point — src/shell.c</text>
  <rect class="box" x="330" y="36" width="326" height="104" fill="#ffffff" stroke="#0b0b0b"/>
  <text class="dim" x="342" y="56">static const command_t *const all_tables[] = {</text>
  <text xml:space="preserve" class="dim" x="342" y="74" fill="#2a78d6">    cmds_shell,    /* M1 — Anvitha  */</text>
  <text xml:space="preserve" class="dim" x="342" y="92" fill="#eb6834">    cmds_process,  /* M2 — Srujana  */</text>
  <text xml:space="preserve" class="dim" x="342" y="110" fill="#9a9a93">    /* cmds_ipc,      M3 — one line */</text>
  <text xml:space="preserve" class="dim" x="342" y="128">    NULL</text>

  <text class="sub" x="330" y="162">Lookup order, for the word &#8220;run&#8221;:</text>

  <!-- table 1 -->
  <rect class="box" x="330" y="174" width="326" height="56" fill="#eaf2fc" stroke="#2a78d6"/>
  <text class="mono" x="342" y="192" fill="#2a78d6">cmds_shell[]</text>
  <text class="dim"  x="342" y="210">help · system · cpu · top · quit · exit</text>
  <text class="sub"  x="342" y="225" fill="#c0392b">no match — keep walking</text>

  <path class="ln" d="M 493 230 L 493 250"/>

  <!-- table 2 -->
  <rect class="box" x="330" y="250" width="326" height="56" fill="#fdefe8" stroke="#eb6834"/>
  <text class="mono" x="342" y="268" fill="#eb6834">cmds_process[]</text>
  <text class="dim"  x="342" y="286">run · processes</text>
  <text class="sub"  x="342" y="301" fill="#1a7a4a">FOUND — call its handler</text>

  <!-- link the found row back to the left pipeline -->
  <path d="M 330 278 Q 300 278 300 320 L 280 320"
        stroke="#eb6834" stroke-width="1.8" fill="none" marker-end="url(#b2)"/>

  <!-- the rule -->
  <rect class="box" x="24" y="352" width="632" height="44" fill="#f2f2f0" stroke="#52514e"/>
  <text class="sub" x="40" y="373">Adding a module is one line in this list, plus one line in minios.h.</text>
  <text class="sub" x="40" y="387">No existing file changes. The Makefile already globs src/*.c.</text>

  <text class="cap" x="340" y="414" text-anchor="middle">Figure 2 — Command dispatch. Each member owns one table; the shell walks them in order.</text>
</svg>
